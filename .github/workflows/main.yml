name: BauPlaner Pro AAB erstellen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q BauPlaner_Pro_v1.3_Billing_FIX.zip -d android-project
          echo "Project extracted"
          find android-project -maxdepth 3 -type f | head -50

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build AAB
        working-directory: android-project
        run: gradle :app:bundleRelease

      - name: Sign AAB
        working-directory: android-project
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          CLEAN_SIGNING_KEY="$(printf '%s' "$SIGNING_KEY" | tr -d '\r\n ')"
          CLEAN_SIGNING_PASSWORD="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '\r\n')"
          printf '%s' "$CLEAN_SIGNING_KEY" | base64 --decode > upload-keystore.p12
          keytool -list -storetype PKCS12 -keystore upload-keystore.p12 -storepass "$CLEAN_SIGNING_PASSWORD" >/dev/null
          jarsigner -verbose \
            -storetype PKCS12 \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.p12 \
            -storepass "$CLEAN_SIGNING_PASSWORD" \
            -keypass "$CLEAN_SIGNING_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab \
            bauplaner-upload
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: BauPlaner-Pro-AAB-SIGNED
          path: '**/*.aab'
