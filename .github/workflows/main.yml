name: BauPlaner Pro AAB erstellen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Android-Projekt entpacken
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'BauPlaner_Pro_v1.3_Bil*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Keine BauPlaner ZIP gefunden."
            exit 1
          fi

          echo "Verwende: $ZIP_FILE"

          rm -rf android-project
          mkdir android-project
          unzip -q "$ZIP_FILE" -d android-project

          SETTINGS_FILE=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Keine settings.gradle oder settings.gradle.kts gefunden."
            find android-project -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android-Projekt gefunden: $PROJECT_DIR"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Signierschluessel wiederherstellen
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -e

          printf '%s' "$SIGNING_KEY" | base64 --decode > upload-keystore.p12

          keytool -list \
            -storetype PKCS12 \
            -keystore upload-keystore.p12 \
            -storepass "$SIGNING_PASSWORD" \
            -alias bauplaner-upload

          echo "Signierschluessel erfolgreich geladen."

            - name: Release AAB bauen
         run: |
          set -e
          cd "$PROJECT_DIR"
          echo "android.useAndroidX=true" >> gradle.properties
          gradle :app:bundleRelease

      - name: AAB signieren
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -e

          AAB_FILE=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/bundle/release/*.aab' | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "Keine AAB-Datei gefunden."
            exit 1
          fi

          echo "AAB gefunden: $AAB_FILE"

          cp "$AAB_FILE" BauPlaner-Pro-release-signed.aab

          jarsigner \
            -verbose \
            -storetype PKCS12 \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.p12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            BauPlaner-Pro-release-signed.aab \
            bauplaner-upload

          jarsigner -verify -verbose -certs BauPlaner-Pro-release-signed.aab

      - name: Signiertes AAB bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: BauPlaner-Pro-AAB-SIGNED
          path: BauPlaner-Pro-release-signed.aab
