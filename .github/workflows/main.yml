name: BauPlaner Pro - neuen Signierschluessel erstellen

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Signierschluessel erstellen
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -noprompt \
            -keystore upload-keystore.p12 \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias bauplaner-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BauPlaner Pro, OU=BauPlaner Pro, O=BauPlaner Pro, C=DE"

          base64 -w 0 upload-keystore.p12 > SIGNING_KEY.txt

      - name: Dateien bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: bauplaner-signing-files
          path: |
            upload-keystore.p12
            SIGNING_KEY.txt
