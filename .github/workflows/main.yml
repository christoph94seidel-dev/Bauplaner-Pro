name: Build BauPlaner Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q BauPlaner_Pro_v1.3_Billing.zip -d android-project
          echo "Project extracted"
          find android-project -maxdepth 3 -type f | head -50

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build AAB
        working-directory: android-project
        run: gradle :app:bundleRelease 

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: BauPlaner-Pro-AAB
          path: '**/*.aab'
