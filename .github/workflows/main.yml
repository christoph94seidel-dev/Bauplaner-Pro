name: BauPlaner Pro - Signierschluessel erstellen

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Neuen Signierschluessel erstellen
        run: |
          keytool -genkeypair \
            -v \
            -keystore upload-keystore.p12 \
            -storetype PKCS12 \
            -storepass "BauPlaner2026Pro" \
            -keypass "BauPlaner2026Pro" \
            -alias bauplaner \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BauPlaner Pro, OU=Erdbau Seidel, O=Erdbau Seidel, C=DE"

      - name: Signierschluessel bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: bauplaner-upload-keystore
          path: upload-keystore.p12
